# CI matrix reference — not a workflow, and not a template.
#
# The executable CI matrix lives in .github/workflows/ci.yml. That file is the
# single source of truth: if the two ever disagree, the workflow is correct and
# this file is stale. Edit the workflow, then update the summary below.
#
# This file deliberately contains no `jobs:` definitions. It used to carry a
# copy of the workflow that drifted out of date and pinned action revisions
# that do not exist on GitHub, so nobody should copy it into .github/workflows/.
#
# See CONTRIBUTING.md for how to run the same checks locally.
source_of_truth: .github/workflows/ci.yml

# What CI exercises on every push and pull request.
supported:
  # verify job: a single runner today. The wider os matrix below is intended,
  # not enabled - see `not_yet_exercised`.
  os: [windows-latest]
  node: ['24']
  jobs: [verify]

# Declared or intended coverage that CI does not exercise yet. Listed so the
# gap is visible rather than implied by the `supported` block above.
not_yet_exercised:
  # '22.15' is the floor declared in package.json "engines" and printed by
  # `--version`; no job runs on it.
  node: ['22.15']
  os: [ubuntu-latest, macos-latest]
  # A fail-fast-disabled cartesian product of the above, so one broken OS/Node
  # pair still reports the others.
  matrix: disabled
  # A Bun smoke job and a release-rehearsal job. scripts/rehearse-release.mjs
  # exists and runs locally; nothing invokes it from CI.
  jobs: [bun, release]

# Every action is pinned to a full 40-character commit SHA rather than a
# mutable tag like @v4. Tags are branches that the action owner can re-point at
# new code at any time, so a tag reference means the code CI executes can change
# without a commit to this repository, and a compromised or typo'd tag fails the
# whole pipeline. A full SHA is immutable and auditable; the human-readable
# version stays in a trailing comment on each `uses:` line.
pinning: full commit SHAs

